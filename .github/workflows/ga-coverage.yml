name: Site Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ga-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check GA coverage
        run: ./scripts/check-ga-coverage.sh

  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # update-sitemap.sh derives lastmod from each page's last commit date,
          # so it needs full history — the default shallow clone breaks git log.
          fetch-depth: 0

      - name: Check sitemap lastmod and URL health
        run: ./scripts/update-sitemap.sh --check

  token-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check design token hygiene
        run: ./scripts/check-token-hygiene.sh
